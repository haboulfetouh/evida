# TLS-terminating ingress. /api/v1 goes straight to the API (keeps SSE streams unbuffered);
# everything else to the web app. Same origin → first-party HttpOnly cookies, no CORS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: evida
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 12m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  ingressClassName: nginx
  tls: [{ hosts: [evida.example.com], secretName: evida-tls }]
  rules:
    - host: evida.example.com
      http:
        paths:
          - { path: /api/v1, pathType: Prefix, backend: { service: { name: evida-api, port: { name: http } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: evida-web, port: { name: http } } } }
