apiVersion: apps/v1
kind: Deployment
metadata:
  name: evida-worker
  labels: { app: evida-worker }
spec:
  replicas: 2
  selector: { matchLabels: { app: evida-worker } }
  template:
    metadata:
      labels: { app: evida-worker }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "4100", prometheus.io/path: /metrics }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 330 # let in-flight AI jobs finish (longest job timeout is 300s)
      containers:
        - name: worker
          image: evida-api
          command: ["node", "dist/worker.js"]
          ports: [{ containerPort: 4100, name: metrics }]
          envFrom: [{ configMapRef: { name: evida-config } }, { secretRef: { name: evida-secrets } }]
          env: [{ name: OTEL_SERVICE_NAME, value: evida-worker }]
          readinessProbe: { httpGet: { path: /health/ready, port: metrics }, periodSeconds: 15 }
          livenessProbe: { httpGet: { path: /health/live, port: metrics }, periodSeconds: 30 }
          resources: { requests: { cpu: 200m, memory: 384Mi }, limits: { memory: 1Gi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: evida-worker }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: evida-worker }
  minReplicas: 2
  maxReplicas: 10
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
