apiVersion: apps/v1
kind: Deployment
metadata:
  name: evida-api
  labels: { app: evida-api }
spec:
  replicas: 3
  selector: { matchLabels: { app: evida-api } }
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata:
      labels: { app: evida-api }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "4000", prometheus.io/path: /metrics }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: evida-api } } }
      containers:
        - name: api
          image: evida-api
          ports: [{ containerPort: 4000, name: http }]
          envFrom: [{ configMapRef: { name: evida-config } }, { secretRef: { name: evida-secrets } }]
          env: [{ name: OTEL_SERVICE_NAME, value: evida-api }]
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 10, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 20, failureThreshold: 3 }
          startupProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 3, failureThreshold: 20 }
          resources: { requests: { cpu: 250m, memory: 384Mi }, limits: { memory: 768Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: evida-api }
spec:
  selector: { app: evida-api }
  ports: [{ port: 80, targetPort: http, name: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: evida-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: evida-api }
  minReplicas: 3
  maxReplicas: 12
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: evida-api }
spec:
  minAvailable: 2
  selector: { matchLabels: { app: evida-api } }
