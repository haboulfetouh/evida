# Default-deny ingress; only the ingress controller reaches web/api, web reaches api,
# and Prometheus (namespace "observability") scrapes metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-web }
spec:
  podSelector: { matchLabels: { app: evida-web } }
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } } }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-api }
spec:
  podSelector: { matchLabels: { app: evida-api } }
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
        - podSelector: { matchLabels: { app: evida-web } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: observability } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-worker-metrics }
spec:
  podSelector: { matchLabels: { app: evida-worker } }
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: observability } } }]
