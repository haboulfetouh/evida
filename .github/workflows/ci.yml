# EVIDA CI/CD: lint → typecheck → unit → integration (Postgres+Redis) → security → build → scan → SBOM
# → deploy staging → smoke → manual approval → deploy production. Releases are semver tags (vX.Y.Z).
name: ci
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: evida, POSTGRES_PASSWORD: evida, POSTGRES_DB: evida_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U evida" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      TEST_DATABASE_URL: postgresql://evida:evida@localhost:5432/evida_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - name: Type check (api + web)
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit -w apps/api
      - name: Integration / e2e tests (tenant isolation, authorization, golden path)
        run: npm run test:e2e -w apps/api
      - name: Build
        run: npm run build

  security:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Dependency scan
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - name: SAST (Semgrep)
        uses: semgrep/semgrep-action@v1
        with: { config: 'p/owasp-top-ten p/nodejs p/typescript p/react p/secrets' }
      - name: Filesystem / IaC scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: fs, scan-ref: ., severity: 'CRITICAL,HIGH', exit-code: '1', ignore-unfixed: true }

  ai-eval:
    # Every prompt or model change must pass the evaluation thresholds before release.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: changed
        run: echo "ai=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E 'apps/api/src/ai/|AI_MODEL' -c || true)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.ai != '0'
        with: { node-version: 22, cache: npm }
      - if: steps.changed.outputs.ai != '0'
        run: npm ci && npm run eval:ai
        env: { ANTHROPIC_API_KEY: '${{ secrets.ANTHROPIC_API_KEY_EVAL }}' }

  images:
    needs: [verify, security]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    strategy:
      matrix: { app: [api, web] }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/evida-${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          sbom: true
          provenance: true
          build-args: NEXT_PUBLIC_JITSI_DOMAIN=${{ vars.JITSI_DOMAIN }}
      - name: Container scan
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: 'ghcr.io/${{ github.repository_owner }}/evida-${{ matrix.app }}:sha-${{ github.sha }}', severity: 'CRITICAL,HIGH', exit-code: '1', ignore-unfixed: true }
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with: { image: 'ghcr.io/${{ github.repository_owner }}/evida-${{ matrix.app }}:sha-${{ github.sha }}', format: spdx-json, artifact-name: 'sbom-${{ matrix.app }}.spdx.json' }

  deploy-staging:
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - run: echo "${{ secrets.KUBECONFIG_STAGING }}" > kubeconfig && echo "KUBECONFIG=$PWD/kubeconfig" >> "$GITHUB_ENV"
      - name: Migrate, then roll out
        run: |
          cd infra/k8s && kustomize edit set image evida-api=ghcr.io/${{ github.repository_owner }}/evida-api:sha-${{ github.sha }} evida-web=ghcr.io/${{ github.repository_owner }}/evida-web:sha-${{ github.sha }}
          kubectl -n evida delete job evida-migrate --ignore-not-found
          kubectl apply -k .
          kubectl -n evida wait --for=condition=complete job/evida-migrate --timeout=300s
          kubectl -n evida rollout status deploy/evida-api deploy/evida-worker deploy/evida-web --timeout=600s
      - name: Smoke tests
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.STAGING_URL }}/api/v1/auth/me")" = "401"
          curl -fsS -o /dev/null "${{ vars.STAGING_URL }}/login"

  deploy-production:
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production # requires manual approval in GitHub environment protection rules
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - run: echo "${{ secrets.KUBECONFIG_PRODUCTION }}" > kubeconfig && echo "KUBECONFIG=$PWD/kubeconfig" >> "$GITHUB_ENV"
      - run: |
          cd infra/k8s && kustomize edit set image evida-api=ghcr.io/${{ github.repository_owner }}/evida-api:${GITHUB_REF_NAME#v} evida-web=ghcr.io/${{ github.repository_owner }}/evida-web:${GITHUB_REF_NAME#v}
          kubectl -n evida delete job evida-migrate --ignore-not-found
          kubectl apply -k .
          kubectl -n evida wait --for=condition=complete job/evida-migrate --timeout=300s
          kubectl -n evida rollout status deploy/evida-api deploy/evida-worker deploy/evida-web --timeout=600s
